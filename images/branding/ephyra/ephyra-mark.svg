<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" width="512" height="512">
  <defs>
    <radialGradient id="ephBody" cx="0" cy="0" r="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0FDFF"/>
      <stop offset="0.28" stop-color="#7DEBFA"/>
      <stop offset="0.66" stop-color="#8B93F8"/>
      <stop offset="1" stop-color="#C792FC"/>
    </radialGradient>
    <filter id="ephGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <path id="ephArm" d="M -22 -28 C -20 -45 -14 -55 -14 -62 C -22 -70 -26 -84 -18 -90 C -12 -95 -4 -92 -2 -84 C -1 -80 1 -80 2 -84 C 4 -92 12 -95 18 -90 C 26 -84 22 -70 14 -62 C 14 -55 20 -45 22 -28 Z"/>
    <g id="ephShape">
      <circle r="44"/>
      <use href="#ephArm" transform="rotate(0)"/>
      <use href="#ephArm" transform="rotate(45)"/>
      <use href="#ephArm" transform="rotate(90)"/>
      <use href="#ephArm" transform="rotate(135)"/>
      <use href="#ephArm" transform="rotate(180)"/>
      <use href="#ephArm" transform="rotate(225)"/>
      <use href="#ephArm" transform="rotate(270)"/>
      <use href="#ephArm" transform="rotate(315)"/>
    </g>
    <g id="ephMark">
      <use href="#ephShape" fill="#8B93F8" opacity="0.55" filter="url(#ephGlow)"/>
      <use href="#ephShape" fill="url(#ephBody)"/>
      <g stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M 0 -20 L 0 -70" transform="rotate(0)"/>
        <path d="M 0 -20 L 0 -70" transform="rotate(45)"/>
        <path d="M 0 -20 L 0 -70" transform="rotate(90)"/>
        <path d="M 0 -20 L 0 -70" transform="rotate(135)"/>
        <path d="M 0 -20 L 0 -70" transform="rotate(180)"/>
        <path d="M 0 -20 L 0 -70" transform="rotate(225)"/>
        <path d="M 0 -20 L 0 -70" transform="rotate(270)"/>
        <path d="M 0 -20 L 0 -70" transform="rotate(315)"/>
      </g>
      <g fill="#FFFFFF">
        <circle cx="0" cy="-80.5" r="2.4" transform="rotate(0)"/>
        <circle cx="0" cy="-80.5" r="2.4" transform="rotate(45)"/>
        <circle cx="0" cy="-80.5" r="2.4" transform="rotate(90)"/>
        <circle cx="0" cy="-80.5" r="2.4" transform="rotate(135)"/>
        <circle cx="0" cy="-80.5" r="2.4" transform="rotate(180)"/>
        <circle cx="0" cy="-80.5" r="2.4" transform="rotate(225)"/>
        <circle cx="0" cy="-80.5" r="2.4" transform="rotate(270)"/>
        <circle cx="0" cy="-80.5" r="2.4" transform="rotate(315)"/>
      </g>
      <g fill="#FFFFFF" opacity="0.55">
        <ellipse cx="0" cy="-11" rx="5.5" ry="9" transform="rotate(45)"/>
        <ellipse cx="0" cy="-11" rx="5.5" ry="9" transform="rotate(135)"/>
        <ellipse cx="0" cy="-11" rx="5.5" ry="9" transform="rotate(225)"/>
        <ellipse cx="0" cy="-11" rx="5.5" ry="9" transform="rotate(315)"/>
      </g>
      <circle r="8" fill="#FFFFFF" opacity="0.95"/>
    </g>
  </defs>
  <use href="#ephMark"/>
