name: Release

on:
  push:
    tags:
      # Releases only: vX.Y.Z. Betas (vX.Y.Z-beta.N) don't match, filter patterns match the whole tag.
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/findroid-ce.jks"

      - name: Assemble release APKs
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/findroid-ce.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # The release is created first with the changelog section as its notes (release
          # skill), so add to those notes instead of replacing them. No generated notes here: on
          # its own GitHub compares with Findroid's v1.0.2 (inherited with the fork) and lists
          # every PR since the fork. The release skill adds them with the previous release as
          # the start tag (gh release create --generate-notes --notes-start-tag).
          append_body: true
          body: |

            **Which APK?** `ephyra-v<version>-libre-<abi>.apk` is for phones and tablets,
            `ephyra-v<version>-libre-tv-<abi>.apk` for Android TV. Most phones need `arm64-v8a`;
            32-bit TV boxes such as the Xiaomi Mi Box need `armeabi-v7a`. In Obtainium, filter the TV APK
            with `.*-tv-armeabi-v7a\.apk`.
          files: app/**/build/outputs/apk/**/release/*.apk
