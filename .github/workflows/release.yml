name: Release

on:
  push:
    tags:
      - "v*-ce.*"

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/findroid-ce.jks"

      - name: Assemble release APKs
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/findroid-ce.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # The release is usually created first with the changelog as its notes (upstream-sync
          # skill), so add to those notes instead of replacing them.
          append_body: true
          body: |

            **Which APK?** `findroid-ce-v<version>-libre-<abi>.apk` is for phones and tablets,
            `findroid-ce-v<version>-libre-tv-<abi>.apk` for Android TV. Most phones need `arm64-v8a`;
            32-bit TV boxes such as the Xiaomi Mi Box need `armeabi-v7a`. In Obtainium, filter the TV APK
            with `.*-tv-armeabi-v7a\.apk`.
          files: app/**/build/outputs/apk/**/release/*.apk
